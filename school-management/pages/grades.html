<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grades — EduCore</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo"><div class="logo-icon">E</div><span>EduCore</span></div>
  <nav class="sidebar-nav">
    <a href="../index.html" class="nav-item"><span class="nav-icon">⊞</span> Dashboard</a>
    <a href="students.html"  class="nav-item"><span class="nav-icon">👤</span> Students</a>
    <a href="teachers.html"  class="nav-item"><span class="nav-icon">🎓</span> Teachers</a>
    <a href="courses.html"   class="nav-item"><span class="nav-icon">📚</span> Courses</a>
    <a href="attendance.html" class="nav-item"><span class="nav-icon">✅</span> Attendance</a>
    <a href="grades.html"    class="nav-item active"><span class="nav-icon">📊</span> Grades</a>
    <a href="notices.html"   class="nav-item"><span class="nav-icon">📢</span> Notices</a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-card"><div class="user-avatar">A</div><div><div class="user-name">Admin</div><div class="user-role">Super Admin</div></div></div>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <h1 class="page-title">Grades & Results</h1>
  </header>
  <div class="page-body">
    <div class="section-header">
      <div class="search-bar" style="flex:1;margin-bottom:0">
        <input type="text" class="search-input" placeholder="🔍  Search student name or course…" id="searchInput" oninput="renderTable()"/>
        <select class="search-input" style="max-width:160px" id="filterExam" onchange="renderTable()">
          <option value="">All Exams</option>
          <option>Midterm</option><option>Final</option><option>Assignment</option><option>Quiz</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="openModal()" style="margin-left:14px">+ Add Grade</button>
    </div>

    <div class="table-wrapper" style="margin-top:16px">
      <table class="data-table">
        <thead>
          <tr><th>Student</th><th>Course</th><th>Exam Type</th><th>Marks</th><th>Total</th><th>%</th><th>Grade</th><th>Date</th><th>Action</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 class="modal-title">Add Grade</h2>
    <div class="form-grid">
      <div class="form-group full">
        <label class="form-label">Student *</label>
        <select class="form-select" id="fStudent"></select>
      </div>
      <div class="form-group full">
        <label class="form-label">Course *</label>
        <select class="form-select" id="fCourse"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Exam Type *</label>
        <select class="form-select" id="fExam">
          <option>Midterm</option><option>Final</option><option>Assignment</option><option>Quiz</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Date</label>
        <input type="date" class="form-input" id="fDate"/>
      </div>
      <div class="form-group">
        <label class="form-label">Marks Obtained *</label>
        <input type="number" class="form-input" id="fMarks" placeholder="0-100" min="0" max="100"/>
      </div>
      <div class="form-group">
        <label class="form-label">Total Marks</label>
        <input type="number" class="form-input" id="fTotal" value="100"/>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveGrade()">Save Grade</button>
    </div>
  </div>
</div>

<script src="../js/storage.js"></script>
<script>
  const gradeColors = { 'A+':'#4fbb7c','A':'#4fbb7c','B':'#4f8ef7','C':'#f5c842','D':'#f7824f','F':'#ff5050' };

  function renderTable() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const exam   = document.getElementById('filterExam').value;
    let data = SMS.getGrades().filter(g =>
      (g.studentName.toLowerCase().includes(search) || g.course.toLowerCase().includes(search)) &&
      (!exam || g.examType === exam)
    );
    const tbody = document.getElementById('tableBody');
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state"><div class="empty-state-icon">📊</div><p>No grades found</p></div></td></tr>`;
      return;
    }
    tbody.innerHTML = data.map(g => {
      const pct = Math.round((g.marks / g.total) * 100);
      const gl  = getGradeLetter(pct);
      return `<tr>
        <td><strong>${g.studentName}</strong></td>
        <td>${g.course}</td>
        <td><span class="badge badge-new">${g.examType}</span></td>
        <td><strong>${g.marks}</strong></td>
        <td style="color:var(--text2)">${g.total}</td>
        <td>${pct}%</td>
        <td><span style="font-weight:700;color:${gradeColors[gl]||'var(--text)'}">${gl}</span></td>
        <td style="color:var(--text2);font-size:12px">${g.date||'—'}</td>
        <td><button class="btn btn-danger btn-sm" onclick="deleteGrade(${g.id})">Delete</button></td>
      </tr>`;
    }).join('');
  }

  function openModal() {
    const sSel = document.getElementById('fStudent');
    sSel.innerHTML = SMS.getStudents().map(s => `<option value="${s.id}|${s.name}">${s.name} (${s.class})</option>`).join('');
    const cSel = document.getElementById('fCourse');
    cSel.innerHTML = SMS.getCourses().map(c => `<option value="${c.name}">${c.name}</option>`).join('');
    document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('fMarks').value = '';
    document.getElementById('fTotal').value = '100';
    document.getElementById('modal').classList.add('open');
  }
  function closeModal() { document.getElementById('modal').classList.remove('open'); }

  function saveGrade() {
    const sv     = document.getElementById('fStudent').value.split('|');
    const marks  = parseFloat(document.getElementById('fMarks').value);
    const total  = parseFloat(document.getElementById('fTotal').value);
    if (!sv[0] || isNaN(marks)) { showToast('Fill all fields', 'error'); return; }
    SMS.addGrade({
      studentId:   parseInt(sv[0]),
      studentName: sv[1],
      course:      document.getElementById('fCourse').value,
      examType:    document.getElementById('fExam').value,
      marks, total,
      date:        document.getElementById('fDate').value,
    });
    showToast('Grade saved!');
    closeModal(); renderTable();
  }

  function deleteGrade(id) {
    if (!confirm('Delete this grade?')) return;
    SMS.deleteGrade(id); showToast('Deleted', 'error'); renderTable();
  }

  renderTable();
</script>
</body>
</html>
