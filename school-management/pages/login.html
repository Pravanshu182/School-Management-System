<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – EduCore</title>
  <meta name="description" content="Login page for EduCore school management system. Choose role (Student, Teacher, Admin) and sign in.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap"
        rel="stylesheet">
</head>
<body>
  <!-- centered glass‑morphic card -->
  <section class="page-body">
    <div class="glass-card login-card">
      <h1 class="form-title">Welcome Back</h1>

      <form id="loginForm" class="form-grid">
        <!-- Role selector (radio buttons) -->
        <div class="form-group full">
          <label class="form-label">Login as</label>
          <div class="role-options">
            <label>
              <input type="radio" name="role" value="student" checked>
              <span>Student</span>
            </label>
            <label>
              <input type="radio" name="role" value="teacher">
              <span>Teacher</span>
            </label>
            <label>
              <input type="radio" name="role" value="admin">
              <span>Admin</span>
            </label>
          </div>
        </div>

        <div class="form-group full">
          <label class="form-label" for="loginEmail">Email</label>
          <input type="email" id="loginEmail" class="form-input" required placeholder="you@example.com">
        </div>

        <div class="form-group full">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-input" required placeholder="••••••••">
        </div>

        <div class="form-actions full">
          <button type="submit" class="btn btn-primary">Sign In</button>
          <a href="signup.html" class="btn btn-ghost">Create Account</a>
        </div>
      </form>
    </div>
  </section>

  <script src="js/auth.js"></script>
</body>
</html>
